<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Complaint</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 2rem; }
        .container { max-width: 800px; margin: auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; text-align: center; }
        form { display: flex; flex-direction: column; gap: 1.2rem; }
        label { font-weight: bold; margin-bottom: -0.5rem; }
        textarea, select, input[type="text"] { width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; box-sizing: border-box; }
        textarea { resize: vertical; min-height: 120px; }
        button { background-color: #007bff; color: white; padding: 0.75rem 1.5rem; border: none; border-radius: 4px; font-size: 1.1rem; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: #0056b3; }
        .other-input { display: none; margin-top: -0.5rem; }
        nav a { margin-right: 1rem; color: #007bff; font-weight: bold; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="{{ url_for('index') }}">Submit Complaint</a> |
            <a href="{{ url_for('status_check') }}">Check Status</a> |
            <a href="{{ url_for('dashboard') }}">Agent Dashboard</a>
        </nav>
        <hr>
        <h1>Submit a Consumer Complaint</h1>
        <form action="/predict" method="post">
            <label for="text">Complaint Narrative:</label>
            <textarea id="text" name="text" required></textarea>

            <label for="product">Product:</label>
            <select id="product" name="product" required onchange="toggleOther(this, 'product_other')">
                <option value="" disabled selected>-- Select a Product --</option>
                {% for p in products %}
                    <option value="{{ p }}">{{ p }}</option>
                {% endfor %}
                <option value="Other">Other (Please specify)</option>
            </select>
            <input type="text" id="product_other" name="product_other" class="other-input" placeholder="Enter product name">

            <label for="company">Company:</label>
            <select id="company" name="company" required onchange="toggleOther(this, 'company_other')">
                <option value="" disabled selected>-- Select a Company --</option>
                {% for c in companies %}
                    <option value="{{ c }}">{{ c }}</option>
                {% endfor %}
                <option value="Other">Other (Please specify)</option>
            </select>
            <input type="text" id="company_other" name="company_other" class="other-input" placeholder="Enter company name">

            <label for="timely">Was the company's response timely?</label>
            <select id="timely" name="timely" required>
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select>

            <button type="submit">Submit and Analyze</button>
        </form>
    </div>

    <script>
        function toggleOther(selectElement, otherInputId) {
            const otherInput = document.getElementById(otherInputId);
            if (selectElement.value === 'Other') {
                otherInput.style.display = 'block';
                otherInput.required = true;
            } else {
                otherInput.style.display = 'none';
                otherInput.required = false;
            }
        }
    </script>
</body>
</html>
