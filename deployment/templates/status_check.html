<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Check Complaint Status</title>
     <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 2rem; }
        .container { max-width: 600px; margin: auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; text-align: center; }
        form { display: flex; flex-direction: column; gap: 1rem; margin-top: 2rem; }
        label { font-weight: bold; }
        input[type="number"] { padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        button { background-color: #007bff; color: white; padding: 0.75rem 1.5rem; border: none; border-radius: 4px; font-size: 1.1rem; cursor: pointer; }
        .error { color: #d8000c; background-color: #ffdddd; padding: 1rem; border-radius: 4px; text-align: center; }
        nav a { margin-right: 1rem; color: #007bff; font-weight: bold; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="{{ url_for('index') }}">Submit Complaint</a> |
            <a href="{{ url_for('status_check') }}">Check Status</a> |
            <a href="{{ url_for('dashboard') }}">Agent Dashboard</a>
        </nav>
        <hr>
        <h1>Check Complaint Status</h1>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        <form action="/status" method="post">
            <label for="complaint_id">Enter your Complaint Reference ID:</label>
            <input type="number" id="complaint_id" name="complaint_id" required>
            <button type="submit">Check Status</button>
        </form>
    </div>
</body>
</html>
