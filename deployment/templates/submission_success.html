<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submission Successful</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 2rem; display: flex; justify-content: center; align-items: center; height: 80vh; }
        .container { max-width: 600px; text-align: center; background: white; padding: 2.5rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #28a745; }
        p { font-size: 1.1rem; color: #333; }
        .complaint-id { background-color: #e9ecef; padding: 1rem; border-radius: 4px; font-size: 1.5rem; font-weight: bold; color: #000; margin: 1.5rem 0; }
        a { color: #007bff; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Submission Successful!</h1>
        <p>Your complaint has been received and analyzed.</p>
        <p>Please save your Complaint Reference ID for future status checks:</p>
        <div class="complaint-id">{{ complaint_id }}</div>
        <p><a href="{{ url_for('status_check') }}">Check Status Now</a> or <a href="{{ url_for('index') }}">Submit Another Complaint</a></p>
    </div>
</body>
</html>
